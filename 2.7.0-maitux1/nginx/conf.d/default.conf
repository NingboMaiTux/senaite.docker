upstream senaite_backend {
    server instance:8080;
}

map $http_host $vhb_port_http {
    default     80;
    "~:(\d+)$"  $1;
}

map $http_host $vhb_port_https {
    default     443;
    "~:(\d+)$"  $1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location ~* \.map$ {
        return 403;
    }

    location / {
        proxy_pass http://senaite_backend/VirtualHostBase/http/$host:$vhb_port_http/VirtualHostRoot$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $vhb_port_http;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certificate/certificate.pem;
    ssl_certificate_key /etc/nginx/certificate/certificate.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location ~* \.map$ {
        return 403;
    }

    location / {
        proxy_pass http://senaite_backend/VirtualHostBase/https/$host:$vhb_port_https/VirtualHostRoot$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $vhb_port_https;
        proxy_set_header X-Forwarded-Proto https;
    }
}
