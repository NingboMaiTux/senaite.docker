upstream senaite_backend {
    server instance:8080;
}

# Zope 的 VirtualHostMonster 要求把对外的 scheme 和端口显式告诉它，它据此生成
# 所有绝对地址（absolute_url / portal_url）。这两样都不能想当然：
#
# scheme —— 443 块固定 https。80 块不能写死 http：前面可能还有一层代理
# （客户的 WAF / SLB / 另一台 nginx）终结了 TLS 再以明文转发进来，此时请求落在
# 80，但对外其实是 https，只有 X-Forwarded-Proto 能告知。这里用白名单匹配
# （只有字面 https 才算），避免把任意请求头内容拼进 URL 路径。
map $http_x_forwarded_proto $vhb_scheme_80 {
    default  http;
    https    https;
}

# 端口 —— 默认值必须跟着 scheme 走，否则前置代理场景下会生成 https://host:80/...
map $vhb_scheme_80 $vhb_defport_80 {
    default  80;
    https    443;
}

# Host 头里确实带了端口（端口映射部署，如 8086:80）就沿用它，否则用上面的默认
# 值。端口不能省略：省略时 Zope 会回落到它自己监听的 8080，生成
# https://host:8080/... 这种打不开的链接，而浏览器在标准端口下不会在 Host 头里
# 带端口。这也顺带修掉了 X-Forwarded-Port 原先用 $server_port 的问题：
# $server_port 是 nginx 在容器内监听的端口，恰恰在端口映射时报错值。
map $http_host $vhb_port_80 {
    default     $vhb_defport_80;
    "~:(\d+)$"  $1;
}

map $http_host $vhb_port_443 {
    default     443;
    "~:(\d+)$"  $1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # 临时排障探针：一次请求即可看清前置拓扑（确认完请 revert 本提交）
    location = /_vhb-debug {
        default_type text/plain;
        return 200 "server_port=$server_port\nhttp_host=$http_host\nx_forwarded_proto=$http_x_forwarded_proto\nx_forwarded_for=$http_x_forwarded_for\nremote_addr=$remote_addr\n";
    }

    location ~* \.map$ {
        return 403;
    }

    location / {
        # VirtualHostBase/<scheme>/<host>:<port>/ 告诉 Zope 对外的真实入口，紧跟
        # 其后的 VirtualHostRoot 把虚拟根设为 Zope 根，即保持原有行为不变。
        #
        # 主机名用 $host 而非 $http_host：端口由上面的 map 单独给出，避免重复；
        # 且 $host 在请求不带 Host 头时会回落到 server_name，不会出现空段把
        # VirtualHostRoot 本身误当主机名（实测会生成 https://VirtualHostRoot:8080/）。
        #
        # proxy_pass 的路径里含变量时 nginx 不再自动追加请求路径，
        # 必须显式拼上 $request_uri。
        proxy_pass http://senaite_backend/VirtualHostBase/$vhb_scheme_80/$host:$vhb_port_80/VirtualHostRoot$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $vhb_port_80;
        proxy_set_header X-Forwarded-Proto $vhb_scheme_80;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certificate/certificate.pem;
    ssl_certificate_key /etc/nginx/certificate/certificate.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    # 临时排障探针：一次请求即可看清前置拓扑（确认完请 revert 本提交）
    location = /_vhb-debug {
        default_type text/plain;
        return 200 "server_port=$server_port\nhttp_host=$http_host\nx_forwarded_proto=$http_x_forwarded_proto\nx_forwarded_for=$http_x_forwarded_for\nremote_addr=$remote_addr\n";
    }

    location ~* \.map$ {
        return 403;
    }

    location / {
        # 见 80 端口块的说明。TLS 在这里终结，scheme 固定 https，不依赖 $scheme
        # 也不依赖请求头，所以前面再套一层终结 TLS 的 WAF/SLB 也不影响。
        proxy_pass http://senaite_backend/VirtualHostBase/https/$host:$vhb_port_443/VirtualHostRoot$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $vhb_port_443;
        proxy_set_header X-Forwarded-Proto https;
    }
}
