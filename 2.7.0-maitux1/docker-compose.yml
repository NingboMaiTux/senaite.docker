# 时间与时区是两层，不要混：
#
# 时钟 —— 容器共享宿主内核时钟（CLOCK_REALTIME 不参与命名空间隔离），所以容器
# 时间恒等于宿主时间，不需要任何配置。授时只在宿主做（chrony 对接内网时间源）；
# 容器内绝不跑 ntpd/chrony：调时钟需要 CAP_SYS_TIME（Docker 默认已丢弃），真给了
# 也是去改宿主时钟，连带影响同机所有容器。
#
# 时区 —— 只影响时间的「显示」。下面每个服务都给了两样：
#   /etc/localtime 挂载   跟随宿主时区
#   TZ: Asia/Shanghai     显式声明；glibc 中 TZ 优先于 /etc/localtime
# 只挂载时，时区取决于实施时宿主怎么配 —— 实测宿主为 UTC 时三个容器全渲染 UTC，
# SENAITE 时间戳就会差 8 小时。加上 TZ 后结果与宿主无关、可复现。三个镜像都自带
# zoneinfo，所以 TZ 不会静默退回 UTC。
#
# 另注：SENAITE 界面上显示的时间还受 Plone 的 portal_timezone 控制
# （@@dateandtime-controlpanel），那个值存在 ZODB 里，不由本文件决定。

services:
  postgres:
    image: postgres:18
    container_name: maitux-lims-postgres
    restart: unless-stopped
    shm_size: 1gb
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: lims_db
      POSTGRES_USER: lims_user
      POSTGRES_PASSWORD: Maitux=123456
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - wal_compression=on
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims_user -d lims_db -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./postgres-data:/var/lib/postgresql
    networks:
      - maitux_lims_backend

  instance:
    build:
      context: .
      dockerfile: Dockerfile
    image: crpi-z99l88o2fu3lae8l.cn-hangzhou.personal.cr.aliyuncs.com/maitux/maitux-lims:latest
    container_name: maitux-lims
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024MB
    environment:
      TZ: Asia/Shanghai
      SITE: MaiLIMS
      PASSWORD: Maitux=123456
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      CHAMELEON_CACHE: /data/cache
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/data
      - ./blobstorage:/data/blobstorage
      # custom-addon.cfg 不再从宿主挂载：容器启动时由 /gen-custom-addon.sh
      # 按下面这个目录里实际存在的 add-on 自动生成
      - ./addons/customers:/opt/addons/customers
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
      # 和 entrypoint 一起挂载，避免"改了仓库里的生成规则但镜像里还是旧脚本"
      - ./gen-custom-addon.sh:/gen-custom-addon.sh:ro
    networks:
      - maitux_lims_backend

  nginx:
    image: nginx:1.30.4
    container_name: maitux-lims-nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    depends_on:
      - instance
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/certificate/certificate.pem:/etc/nginx/certificate/certificate.pem:ro
      - ./nginx/certificate/certificate.key:/etc/nginx/certificate/certificate.key:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - maitux_lims_backend

networks:
  maitux_lims_backend:
    driver: bridge
